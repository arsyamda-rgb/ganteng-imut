name: Build JAR

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:   # bisa dijalankan manual dari tab Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Cari pom.xml paling atas (jadi tetap jalan walau project ada di dalam subfolder)
      - name: Find project folder
        id: proj
        run: |
          POM=$(find . -name pom.xml -not -path '*/node_modules/*' | awk '{print gsub("/","/"), $0}' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$POM" ]; then echo "pom.xml tidak ditemukan"; exit 1; fi
          DIR=$(dirname "$POM")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Project: $DIR"

      - name: Build with Maven
        working-directory: ${{ steps.proj.outputs.dir }}
        run: mvn -B -ntp clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: VeyrionCharacter-jar
          path: |
            ${{ steps.proj.outputs.dir }}/target/*.jar
            !${{ steps.proj.outputs.dir }}/target/original-*.jar
          if-no-files-found: error
