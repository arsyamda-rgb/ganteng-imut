# VeyrionCharacter - English messages (MiniMessage format)
# No prefix is shown before command messages.
prefix: ""

command:
  usage: "<yellow>Usage: /<label> info [player] | addexp <player> <amount> | reload"
  addexp-usage: "<yellow>Usage: /<label> addexp <player> <amount>"
  invalid-amount: "<red>Amount must be a positive whole number."
  addexp-success: "<green>Gave <amount> Adventure EXP to <player>. Rank: <yellow><rank></yellow>."
  no-permission: "<red>You do not have permission to do that."
  console-needs-player: "<red>Console must specify a player: /<label> info [player]"
  player-not-found: "<red>No known player named <player>."
  reload-success: "<green>Configuration, language, race and quest files reloaded."
  reload-database-note: "<yellow>Database settings changed; a server restart is required to apply them."
  data-error: "<red>Could not read or write character data. Check the console for details."
  no-character: "<red><player> has no character data yet."

info:
  header: "<gold>Character: <white><player>"
  race: "<gray>Race: <white><value>"
  exp: "<gray>Adventure EXP: <white><value>"
  rank: "<gray>Adventure Rank: <white><value>"
  gacha: "<gray>Gacha completed: <white><value>"
  created: "<gray>Created: <white><value>"

# Note: never use bare yes/no/on/off/true/false as YAML keys; they are parsed as booleans.
value:
  none: "None"
  affirmative: "Yes"
  negative: "No"

exp:
  gain: "<gray>+<green><amount></green> Adventure EXP"

rank:
  up: "<gold>Rank up! You are now <yellow><rank></yellow>."

quest:
  players-only: "<red>Only players can use this command."
  usage: "<yellow>Usage: /<label> [active | abandon [quest_id]]"
  header: "<gold>Your active quests"
  none-active: "<gray>You have no active quests."
  active-line: "<yellow><name> <dark_gray>(<id>)"
  removed-line: "<red><id> <gray>(quest no longer exists)"
  objective-line: "<gray>  - <description>: <white><progress>/<amount>"
  progress: "<gray><description>: <white><progress>/<amount>"
  accepted: "<green>Quest accepted: <yellow><name>"
  completed: "<green>Quest completed: <yellow><name>"
  reward-exp: "<gray>  +<exp> Adventure EXP"
  reward-vyr: "<gray>  +<green><amount></green>"
  reward-vyr-pending: "<yellow>Hadiah <amount> akan dikirim otomatis begitu sistem ekonomi tersedia."
  abandoned: "<yellow>Quest abandoned: <id>"
  abandon-disabled: "<red>Abandoning quests is disabled."
  abandon-usage: "<yellow>Usage: /<label> abandon <quest_id>"
  not-active: "<red>That quest is not active."
  unknown: "<red>Unknown quest: <id>"
  state-loading: "<red>Quest data is still loading. Try again in a moment."
  error: "<red>Quest operation failed. Check the console for details."
  blocked:
    active: "<red>That quest is already active."
    completed: "<red>You have already completed that quest."
    cooldown: "<red>That quest is on cooldown for <time>."
    prerequisite: "<red>You must complete earlier quests first."
    rank: "<red>Your Adventure Rank is too low. Required: <rank>."

scoreboard:
  title: "<gradient:#FFE08A:#F2A900><bold>VEYRION</bold></gradient>"
  separator: "<dark_gray>─────────────"
  area: "<gold><area>"
  objective-label: "<gray>Objective:"
  objective: "<white><objective>"
  progress: "<gray>Progress: <green><progress>/<amount>"
  footer: "<gold><bold>YOUR ADVENTURE"

admin:
  usage: "<yellow>Usage: /<label> reload | give <player> <quest> | reset <player> <quest> | complete <player> <quest> | list | info <quest> | progress <player> <quest> <objective> [amount]"
  reloaded: "<green>Loaded <count> quest(s)."
  player-offline: "<red><player> is not online."
  given: "<green>Gave quest <id> to <player>."
  give-failed: "<red>Could not give quest <id> to <player> (see the other message or console)."
  reset: "<green>Reset quest <id> for <player>."
  completed: "<green>Completed quest <id> for <player>."
  not-active: "<red><player> does not have quest <id> active."
  progressed: "<green>Progressed objective <objective> of <id> for <player>."
  unknown-objective: "<red>Quest <id> has no objective named <objective>."
  list-header: "<gold>Quests (<count>)"
  list-line: "<gray>- <yellow><id> <gray>[<type>] <white><name>"
  info-header: "<gold>Quest <yellow><id> <gray>[<type>]"
  info-line: "<gray><label>: <white><value>"
  info-objective: "<gray>  - <id>: <white><type> x<amount> <gray>(<description>)"

race:
  players-only: "<red>Only players can use this command."
  usage: "<yellow>Usage: /<label> [info | roll | skip]"
  info-header: "<gold>Your race"
  info-race: "<gray>Race: <value>"
  info-description: "<gray><description>"
  info-gacha: "<gray>Gacha completed: <value>"
  info-hint: "<yellow>You have not chosen a race yet. Use <white>/race roll</white> to roll one."
  roll-success: "<green>The roll is done! You are now <race> <gray>(<chance>% chance)"
  roll-already: "<red>You have already rolled your race."
  roll-in-progress: "<yellow>Your roll is already being processed."
  no-races: "<red>No races are available to roll right now. Ask an admin."
  no-character: "<red>Your character data is not ready yet. Try again in a moment."
  admin:
    usage: "<yellow>Usage: /<label> set <player> <race> | reset <player> | chances | population [detailed|refresh] | altar set|remove|info|reload|preview [race]"
    unknown-race: "<red>Unknown race '<race>'. Available: <list>"
    set-success: "<green>Set the race of <player> to <race>."
    set-notify: "<yellow>An admin set your race to <race>."
    reset-success: "<green>Reset the race and gacha status of <player>."
    reset-notify: "<yellow>An admin reset your race. You can use /race roll again."
    chances-header: "<gold>Race chances <gray>(<total> registered character(s), <unassigned> without a race)"
    chances-line: "<gray>- <race> <dark_gray>| <gray>weight <white><weight> <dark_gray>| <gray>pop <white><population><gray>/<white><expected> <dark_gray>| <gray>x<white><multiplier> <dark_gray>| <yellow><chance>%"
    chances-dynamic-off: "<gray>Dynamic chance is off: base weights are used."
    chances-other: "<gray>Characters with a legacy or disabled race (counted in the total, not rollable): <white><count>"
    population:
      header: "<gold>Population <gray>(<total> registered character(s), online or not)"
      empty: "<yellow>No characters are registered yet."
      refresh-note: "<gray>Population is always read live from the database; there is no cache to refresh."
      enabled: ""
      disabled: " <dark_gray>[disabled]"
      race-line: "<gray>- <race><state> <white><count> <gray>(<percent>%)"
      race-detail: "<gray>- <race><state> <white><count> <gray>| <percent>% of registered | <assigned_percent>% of assigned"
      legacy-line: "<gray>- Other/legacy races: <white><count> <gray>(<percent>%)"
      unassigned-line: "<gray>- No race yet: <white><count> <gray>(<percent>%)"
      most: "<gray>Most populated: <race> <gray>(<count>)"
      least: "<gray>Least populated: <race> <gray>(<count>)"
      assigned: "<gray>Characters with a race: <white><count> <gray>(<percent>% of registered)"
      legacy-detail: "<gray>  legacy race <yellow><id><gray>: <white><count>"

# Veyra economy messages (Indonesian). <amount> already includes the symbol, e.g. "2,500 VYR".
economy:
  unavailable-config: "<red>Fitur ekonomi dinonaktifkan oleh konfigurasi server."
  unavailable-vault: "<red>Fitur ekonomi tidak tersedia: plugin Vault tidak terpasang."
  unavailable-provider: "<red>Fitur ekonomi tidak tersedia: Vault terpasang, tetapi belum ada plugin ekonomi yang terdaftar."
  command-disabled: "<red>Perintah ini dinonaktifkan oleh konfigurasi server."
  players-only: "<red>Perintah ini hanya untuk pemain."
  target-unknown: "<red>Pemain <player> tidak ditemukan atau belum pernah bermain di server ini."
  invalid-amount: "<red>Jumlah tidak valid. Gunakan angka positif, maksimal 2 desimal, tanpa tanda koma (contoh: 250 atau 12.5)."
  balance: "<gray>Veyra kamu: <gold><amount></gold>"
  balance-error: "<red>Saldo tidak dapat dibaca saat ini. Coba lagi nanti."
  pay-usage: "<yellow>Penggunaan: /<label> <pemain> <jumlah>"
  pay-self: "<red>Kamu tidak bisa mengirim Veyra ke dirimu sendiri."
  pay-too-low: "<red>Jumlah minimum transfer adalah <minimum>."
  pay-cooldown: "<red>Tunggu sebentar sebelum melakukan transaksi lagi."
  pay-insufficient: "<red>Saldo kamu tidak cukup."
  pay-success: "<green>Kamu telah berhasil bertransaksi bersama <target>"
  pay-detail: "<gray>Dikirim: <white><amount></white> | Saldo kamu sekarang: <white><balance></white>"
  pay-received: "<green>Kamu menerima <amount> dari <player>."
  pay-failed: "<red>Transaksi gagal. Tidak ada saldo yang berubah."
  pay-refunded: "<red>Transaksi gagal dan saldo kamu sudah dikembalikan."
  pay-failed-contact-admin: "<red>Transaksi gagal dan saldo belum bisa dikembalikan. Segera hubungi admin."
  baltop-loading: "<gray>Menghitung peringkat saldo..."
  baltop-header: "<gold>Top 10 saldo <currency>"
  baltop-line: "<gray><rank>. <white><player></white> <dark_gray>-</dark_gray> <gold><amount></gold>"
  baltop-empty: "<gray>Belum ada pemain dengan saldo."
  baltop-error: "<red>Peringkat saldo tidak dapat dihitung saat ini."
  admin-usage: "<yellow>Penggunaan: /<label> give|take|set <pemain> <jumlah> | reload"
  admin-give: "<green>Memberi <amount> kepada <player>. Saldo sekarang: <balance>."
  admin-take: "<green>Mengambil <amount> dari <player>. Saldo sekarang: <balance>."
  admin-set: "<green>Saldo <player> diatur ke <balance>."
  admin-take-insufficient: "<red>Saldo <player> hanya <balance>."
  admin-failed: "<red>Operasi gagal: <error>"
  admin-reloaded: "<green>Konfigurasi dimuat ulang. Status ekonomi: <state>"
  pending-header: "<gold>Tiket VYR perlu ditinjau: <white><count></white> <gray>(menunggu pemain online: <waiting>)"
  pending-line: "<gray>#<id> <white><player></white> quest <yellow><quest></yellow> <gold><amount></gold>"
  pending-more: "<gray>... dan <count> lagi."
  pending-help: "<yellow>Cek saldo/log provider dulu. Sudah dibayar: <white>/<label> pending paid <id></white>. Belum dibayar: <white>/<label> pending retry <id> confirm</white>."
  pending-usage: "<yellow>Penggunaan: /<label> pending [list] | pending paid <id> | pending retry <id> confirm"
  pending-retry-warning: "<red>Bayar ulang bisa menggandakan uang jika tiket #<id> sebenarnya sudah dibayar. Pastikan dulu, lalu jalankan: <white>/<label> pending retry <id> confirm"
  pending-done: "<green>Tiket #<id> diperbarui."
  pending-in-flight: "<red>Tiket #<id> sedang diproses. Coba lagi sebentar."
  pending-not-reviewable: "<red>Tiket #<id> tidak ada atau tidak berstatus PAYING."
  pending-error: "<red>Tiket VYR tidak dapat dibaca/diubah. Lihat konsol."

npc:
  usage: "<yellow>Usage: /<label> create <id> [name] | edit <id> | tp <id> | remove <id> | list | reload"
  created: "<green>NPC <white><id></white> created where you stand. Shift + Right Click it to edit it."
  no-protocollib: "<yellow>ProtocolLib is not installed: the NPC is saved but cannot be shown until it is."
  invalid-id: "<red>An id may use a-z, 0-9, _ and - (1 to 32 characters)."
  exists: "<red>An NPC with id <id> already exists."
  unknown: "<red>No NPC with id <id>."
  too-many: "<red>The limit of <max> NPCs is reached."
  storage-error: "<red>The NPC could not be changed: npcs.yml could not be read at start-up, so NPCs are locked. See the console."
  deleted: "<green>NPC <white><id></white> deleted."
  teleported: "<green>Teleported to NPC <white><id></white>."
  world-missing: "<red>The world <world> of this NPC is not loaded."
  reloaded: "<green>npcs.yml reloaded (<count> NPCs)."
  list-empty: "<gray>There are no NPCs."
  list-header: "<gold>NPCs (<count>)"
  list-line: "<yellow><id> <dark_gray>- <gray><world> <x> <y> <z> | quest: <quest> | <state>"
  saved: "<green>Saved."
  moved: "<green>NPC moved to where you stand. Saved."
  shown: "<green>The NPC is now visible. Saved."
  hidden: "<green>The NPC is now hidden from players. Saved."
  skin-set: "<green>Skin changed. Saved."
  skin-cleared: "<green>The NPC uses the default skin again. Saved."
  skin-missing: "<red><player> has no skin data (offline-mode account or unknown player)."
  skin-bad-name: "<red>That is not a valid player name."
  skin-looking: "<gray>Looking up the skin of <player> ..."
  skin-failed: "<red>Could not look up the skin of <player>. Check the name and the server's internet access."
  quest-set: "<green>Quest set. Saved."
  quest-cleared: "<green>The NPC offers no quest. Saved."
  quest-missing: "<red>NPC <id> offers the quest <quest>, which does not exist (admin notice)."
  no-quests: "<red>There are no quests to choose from."
  dialogue-full: "<red>The dialogue is full (<max> lines). Remove one first."
  too-long: "<red>That text is too long (maximum <max> characters)."
  prompt-name: "<yellow>Type the new name in chat (MiniMessage works). Type <white>cancel</white> to abort."
  prompt-skin: "<yellow>Type the player name whose skin the NPC should use. Type <white>cancel</white> to abort."
  prompt-dialogue: "<yellow>Type the new dialogue line in chat (MiniMessage works). Type <white>cancel</white> to abort."
  prompt-cancelled: "<gray>Cancelled."
  prompt-expired: "<red>That took too long. Open the editor again."
  delete-confirm: "<red>Click Delete again within 5 seconds to remove NPC <white><id></white> for good."
